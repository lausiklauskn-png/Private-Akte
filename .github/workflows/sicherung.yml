name: Geschenkbox und Sicherung

# Sammelt die Private Akte und alle angeschlossenen Apps (tools/sicherung/apps.tsv):
# Quellcode mit vollem Verlauf, neueste APK und Windows-Installer, Web-App, dazu Geschenkbox.html,
# INHALT.md, WIEDERHERSTELLEN.md und SHA256SUMS. Von Hand von main mit "veroeffentlichen = ja"
# legt es alles an ein Release "sicherung-<Datum>" (nicht als neueste Fassung markiert).
# Bei Pull Requests nur eine Probe mit drei Apps, ohne Release.

on:
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: 'Als Release "sicherung-<Datum>" ablegen (ja/nein)'
        default: 'nein'
      ersetzen:
        description: 'Ein Release "sicherung-<Datum>" vom selben Tag vorher entfernen (ja/nein)'
        default: 'nein'
  pull_request:
    paths:
      - 'tools/sicherung/**'
      - '.github/workflows/sicherung.yml'

permissions:
  contents: read

jobs:
  sammeln:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h .
      - name: Nur Probe bei Pull Requests
        if: github.event_name == 'pull_request'
        run: |
          grep -E '^(#|Workflow-Calculate|Workflow-Needs|Privat-Brain-Pro)' tools/sicherung/apps.tsv > /tmp/probe.tsv
          cp /tmp/probe.tsv tools/sicherung/apps.tsv
      - name: Sammeln
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/sicherung/sammeln.sh
      - name: Probe prüfen
        run: |
          cd paket
          sha256sum -c SHA256SUMS
          test -s Geschenkbox.html && test -s INHALT.md && test -s WIEDERHERSTELLEN.md
          for z in Quellcode-*-mit-Verlauf.zip; do
            d=$(mktemp -d); unzip -q "$z" -d "$d"; r=$(ls "$d")
            n=$(git -C "$d/$r" rev-list --count --all); echo "$z: $n Commits"; test "$n" -gt 1
            test "$(git -C "$d/$r" rev-parse --is-shallow-repository)" = false
            rm -rf "$d"
          done
          for z in WebApp-*.zip; do
            n=$(unzip -l "$z" | tail -1 | awk '{print $2}'); echo "$z: $n Dateien"
            unzip -l "$z" | grep -q '/index.html$'
          done
          grep -F 'WebApp-' INHALT.md
      - name: Als Release ablegen
        if: github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen == 'ja' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="sicherung-$(date -u +%Y-%m-%d)"
          if [ "${{ inputs.ersetzen }}" = ja ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then tag="$tag-$(date -u +%H%M)"; fi
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Geschenkbox und Sicherung $(date -u +%d.%m.%Y)" --notes-file paket/INHALT.md paket/*
          # von außen nachladen und vergleichen
          mkdir nachgeladen
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D nachgeladen
          cd nachgeladen && sha256sum -c SHA256SUMS
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Bei Probe als Download behalten
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sicherung-probe
          path: paket/
          retention-days: 3
