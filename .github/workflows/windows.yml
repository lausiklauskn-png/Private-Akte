name: Windows-App

# Private Akte Pro für Windows: Tauri 2 / WebView2 + Java-Engine aus dem Klon des Datei-Organizers (Muster Datei-Organizer Pro).
# Baut den Installer, installiert ihn, startet ihn, entfernt ihn wieder. Unsigniert.
# Veröffentlichen nur von Hand (Klaus 20.11.2026: Windows zum Download für Jens): Lauf von main mit `veroeffentlichen = ja` legt den Installer
# zum GitHub-Release v<Fassung> – das Release legt vorher „Android-App signiert“ mit `veroeffentlichen = ja` an.
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: 'Installer zum GitHub-Release v<Fassung> legen (nur von main; „ja“ eintippen)'
        required: false
        default: 'nein'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Engine aus dem Klon übersetzen und als echten Kindprozess prüfen
        run: node windows/engine/build.mjs && node windows/engine/protocol-test.mjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Quellen ohne Zeilenumwandlung auschecken
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --prefix windows
      - name: Rust-Abhängigkeiten
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri -> target
          cache-on-failure: true
      - name: Eigene Java-Laufzeit (jlink) und Symbol
        run: node windows/tools/prepare-runtime.mjs
      - name: Kindprozess mit der gebündelten Laufzeit
        run: node windows/engine/protocol-test.mjs windows/runtime/jre/bin/java.exe windows/runtime
      - name: Installer bauen
        run: npm run tauri --prefix windows -- build --bundles nsis
      - name: Installieren, starten, entfernen
        run: ./windows/pruefung/production.ps1
      - name: Installer mit Prüfsumme bereitlegen
        run: node windows/tools/distribution.mjs
        env:
          DO_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: private-akte-pro-windows
          path: windows/distribution/
          if-no-files-found: error
          retention-days: 30

  veroeffentlichen:
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen == 'ja' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: private-akte-pro-windows
          path: verteilen
      - name: Installer zum Release legen und von außen nachprüfen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          v=$(node -p "require('./windows/package.json').version")
          f="Private-Akte-Pro-Windows-$v-x64-setup.exe"
          test -f "verteilen/$f" || { echo "::error::$f fehlt im Artefakt"; exit 1; }
          gh release view "v$v" -R "$GITHUB_REPOSITORY" > /dev/null || { echo "::error::Release v$v fehlt – erst „Android-App signiert“ mit veroeffentlichen = ja"; exit 1; }
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "$f"; then echo "::error::$f liegt schon am Release v$v"; exit 1; fi
          cp verteilen/SHA256SUMS "verteilen/SHA256SUMS-windows"
          gh release upload "v$v" "verteilen/$f" "verteilen/SHA256SUMS-windows" -R "$GITHUB_REPOSITORY"
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/v$v/$f" | cmp - "verteilen/$f"
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/v$v/$f"
